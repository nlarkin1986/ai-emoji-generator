<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BP Audio Test</title>
<style>
  body { background: #111; color: #eee; font: 13px monospace; margin: 12px; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: #fc0; }
  button { background: #333; color: #eee; border: 1px solid #666; margin: 2px; padding: 6px 8px; font: 12px monospace; cursor: pointer; }
  button:active, button.on { background: #b13; }
  #log { white-space: pre; color: #8f8; min-height: 2em; }
  canvas { display: block; background: #000; margin: 4px 0; image-rendering: pixelated; }
  label { margin-right: 10px; }
</style>
</head>
<body>
<h2>SUPER BEER PONG — BP.Audio harness</h2>
<div>
  <button id="mute">MUTE</button>
  <button id="pause">PAUSE</button>
  <button id="resume">RESUME</button>
  <button id="stop">STOP MUSIC</button>
  <label>tempo <input id="tempo" type="range" min="0.8" max="1.4" step="0.05" value="1"></label>
  <label>volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.9"></label>
  <label>bounce/tally arg <input id="arg" type="range" min="0" max="1" step="0.1" value="0.6"></label>
</div>
<h2>MUSIC</h2><div id="music"></div>
<h2>SFX</h2><div id="sfx"></div>
<h2>STATE</h2><div id="log"></div>
<canvas id="wave" width="1024" height="120"></canvas>
<canvas id="spec" width="1024" height="256"></canvas>
<script>window.BP = window.BP || {}</script>
<script src="../src/audio.js"></script>
<script>
(function () {
  var A = BP.Audio, L = A._list(), $ = function (id) { return document.getElementById(id) }
  function btn(parent, label, fn) { var b = document.createElement('button'); b.textContent = label; b.onclick = function () { A.unlock(); fn(b) }; $(parent).appendChild(b); return b }
  L.music.forEach(function (n) { btn('music', n, function () { A.music(n); show(n) }) })
  L.sfx.forEach(function (n) { btn('sfx', n, function () { A.sfx(n, +$('arg').value); show('sfx:' + n) }) })
  $('mute').onclick = function () { A.unlock(); A.toggleMute(); $('mute').classList.toggle('on', A.isMuted()) }
  $('mute').classList.toggle('on', A.isMuted())
  $('pause').onclick = function () { A.pause() }
  $('resume').onclick = function () { A.unlock(); A.resume() }
  $('stop').onclick = function () { A.music(null) }
  $('tempo').oninput = function () { A.setTempo(+this.value) }
  $('vol').oninput = function () { A.setVolume(+this.value) }
  setInterval(function () { $('log').textContent = JSON.stringify(A._state()) }, 250)
  function show(spec) {
    var i = A._info(spec), sec = /^sfx:/.test(spec) ? 3 : Math.min(20, i ? i.sec + 0.5 : 4)
    A._renderOffline(spec, sec).then(function (b) { T.draw(b, $('wave'), $('spec'), spec) })
  }

  // ---------------------------------------------------------------- analysis helpers (used by audiotest.mjs)
  function fft(re, im) {
    var n = re.length, i, j, k, l
    for (i = 1, j = 0; i < n; i++) { var bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { var t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t } }
    for (l = 2; l <= n; l <<= 1) {
      var a = -2 * Math.PI / l, wr = Math.cos(a), wi = Math.sin(a)
      for (i = 0; i < n; i += l) {
        var cr = 1, ci = 0
        for (k = 0; k < l / 2; k++) {
          var ur = re[i + k], ui = im[i + k], vr = re[i + k + l / 2] * cr - im[i + k + l / 2] * ci, vi = re[i + k + l / 2] * ci + im[i + k + l / 2] * cr
          re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + l / 2] = ur - vr; im[i + k + l / 2] = ui - vi
          var nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr
        }
      }
    }
  }
  var T = window.T = {
    stats: function (b) {
      var d = b.getChannelData(0), sr = b.sampleRate, pk = 0, ss = 0, first = -1, last = -1, nan = 0
      for (var i = 0; i < d.length; i++) {
        var v = d[i]; if (v !== v) { nan++; continue }
        var a = Math.abs(v); if (a > pk) pk = a; ss += v * v
        if (a > 0.002) { if (first < 0) first = i; last = i }
      }
      return { len: d.length / sr, peak: pk, rms: Math.sqrt(ss / d.length), first: first / sr, last: last / sr, nan: nan }
    },
    env: function (b, t0, t1, win) { // RMS envelope
      var d = b.getChannelData(0), sr = b.sampleRate, w = Math.round(win * sr), out = []
      for (var s = Math.round(t0 * sr); s + w <= Math.round(t1 * sr) && s + w <= d.length; s += w) { var ss = 0; for (var i = s; i < s + w; i++) ss += d[i] * d[i]; out.push(Math.sqrt(ss / w)) }
      return out
    },
    corr: function (a, b) {
      var n = Math.min(a.length, b.length), ma = 0, mb = 0, i
      for (i = 0; i < n; i++) { ma += a[i]; mb += b[i] } ma /= n; mb /= n
      var sab = 0, saa = 0, sbb = 0
      for (i = 0; i < n; i++) { sab += (a[i] - ma) * (b[i] - mb); saa += (a[i] - ma) * (a[i] - ma); sbb += (b[i] - mb) * (b[i] - mb) }
      return sab / Math.sqrt(saa * sbb + 1e-12)
    },
    centroid: function (b) { // spectral centroid over the whole clip
      var d = b.getChannelData(0), N = 2048, sr = b.sampleRate, num = 0, den = 0
      for (var s = 0; s + N <= d.length; s += N / 2) {
        var re = new Float64Array(N), im = new Float64Array(N)
        for (var i = 0; i < N; i++) re[i] = d[s + i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / N))
        fft(re, im)
        for (var k = 1; k < N / 2; k++) { var m = Math.hypot(re[k], im[k]); num += m * k * sr / N; den += m }
      }
      return den ? num / den : 0
    },
    wav: function (b) {
      var d = b.getChannelData(0), n = d.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf), sr = b.sampleRate
      function s(o, str) { for (var i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)) }
      s(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8, 'WAVE'); s(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true)
      v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, n * 2, true)
      for (var i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true)
      var bytes = new Uint8Array(buf), str = ''
      for (var j = 0; j < bytes.length; j += 0x8000) str += String.fromCharCode.apply(null, bytes.subarray(j, j + 0x8000))
      return btoa(str)
    },
    draw: function (b, wc, sc, title) {
      var d = b.getChannelData(0), W = wc.width, H = wc.height, g = wc.getContext('2d'), per = Math.max(1, Math.floor(d.length / W))
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.fillStyle = '#4f4'
      for (var x = 0; x < W; x++) {
        var mn = 1, mx = -1
        for (var i = x * per; i < (x + 1) * per && i < d.length; i++) { if (d[i] < mn) mn = d[i]; if (d[i] > mx) mx = d[i] }
        if (mx >= mn) g.fillRect(x, H / 2 - mx * H / 2, 1, Math.max(1, (mx - mn) * H / 2))
      }
      g.fillStyle = '#f44'; g.fillRect(0, 0, W, 1); g.fillRect(0, H - 1, W, 1)
      g.fillStyle = '#fff'; g.font = '12px monospace'; g.fillText(title + '  ' + b.duration.toFixed(2) + 's', 4, 12)
      // spectrogram 0..8 kHz, log magnitude
      var sg = sc.getContext('2d'), SW = sc.width, SH = sc.height, N = 2048, sr = b.sampleRate, hop = Math.max(1, Math.floor((d.length - N) / SW))
      var img = sg.createImageData(SW, SH), kmax = Math.floor(8000 / (sr / N))
      for (var c = 0; c < SW; c++) {
        var s0 = c * hop, re = new Float64Array(N), im = new Float64Array(N)
        for (var n = 0; n < N; n++) re[n] = (d[s0 + n] || 0) * (0.5 - 0.5 * Math.cos(2 * Math.PI * n / N))
        fft(re, im)
        for (var y = 0; y < SH; y++) {
          var k = Math.max(1, Math.floor((1 - y / SH) * kmax)), m = Math.hypot(re[k], im[k])
          var db = 20 * Math.log10(m + 1e-9), v = Math.max(0, Math.min(255, (db + 30) * 4)), o = (y * SW + c) * 4
          img.data[o] = v; img.data[o + 1] = v * 0.6; img.data[o + 2] = 255 - v * 0.5; img.data[o + 3] = 255
        }
      }
      sg.putImageData(img, 0, 0)
      sg.fillStyle = '#fff'; sg.font = '12px monospace'; sg.fillText('0-8 kHz spectrogram: ' + title, 4, 12)
    },
  }
})()
</script>
</body>
</html>
