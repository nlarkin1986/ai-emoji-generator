<style>
:root{color-scheme:dark;--red:#e4211a;--lbl:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;left:0;top:0;right:0;bottom:0;height:100vh;height:100dvh;color:#bcbcbc;
  font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#000}
body.m-desktop #app{background:radial-gradient(ellipse 80% 70% at 50% 42%,#14142a 0,#07070f 55%,#000 100%)}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.abs,#scr,#tv,#top,#hint,#padbg,#dpad,.sock,.pill,.well,.lbl,.stripe,#face,#logo{position:absolute}
img,svg,canvas{-webkit-user-drag:none;user-select:none}

/* ---- game screen ---- */
#scr{left:0;top:0;width:256px;height:240px;background:#000;overflow:hidden;contain:strict}
#screen{display:block;width:100%;height:100%;background:#000;cursor:pointer;touch-action:none;outline:none;
  image-rendering:optimizeSpeed;image-rendering:-moz-crisp-edges;image-rendering:-webkit-optimize-contrast;
  image-rendering:crisp-edges;image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor}
#crt{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;display:none;
  background:
    radial-gradient(ellipse 75% 70% at 50% 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.42) 100%),
    repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) calc(var(--px,3px)*.55),rgba(0,0,0,.30) calc(var(--px,3px)*.55),rgba(0,0,0,.30) var(--px,3px)),
    repeating-linear-gradient(to right,rgba(255,40,40,.035) 0,rgba(40,255,40,.035) 1px,rgba(40,80,255,.035) 2px,rgba(0,0,0,0) 3px)}
body.crt #crt{display:block}
body.crt #scr{border-radius:calc(var(--px,3px)*5)/calc(var(--px,3px)*6)}
body.crt #screen{filter:brightness(1.12) saturate(1.12) contrast(1.04)}
body.crt #scr::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;
  box-shadow:inset 0 0 calc(var(--px,3px)*10) rgba(0,0,0,.65),inset 0 0 2px rgba(0,0,0,.9)}

/* ---- CRT TV bezel (desktop) ---- */
#tv{display:none;border-radius:26px;
  background:linear-gradient(180deg,#3b3b3e 0,#232326 3%,#18181b 50%,#111113 92%,#0a0a0b 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.85),0 0 0 1px #000,inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.6)}
#tv::before{content:"";position:absolute;left:var(--bz,16px);right:var(--bz,16px);top:var(--bz,16px);bottom:var(--chin,44px);
  border-radius:12px;background:#050505;box-shadow:inset 0 0 0 2px #000,0 1px 0 rgba(255,255,255,.08),0 -1px 0 rgba(0,0,0,.8)}
#tv.show{display:block}
body.m-desktop #scr{box-shadow:0 0 0 2px #000}
#brand{position:absolute;left:22px;bottom:13px;font:italic 900 13px/1 var(--lbl);letter-spacing:.18em;color:#8d8d93;
  text-shadow:0 1px 0 #000,0 -1px 0 rgba(255,255,255,.12)}
#brand b{color:var(--red);font-style:italic}
#led{position:absolute;right:20px;bottom:17px;width:8px;height:8px;border-radius:50%;background:#ff2a1a;
  box-shadow:0 0 6px 1px rgba(255,40,20,.8),inset 0 -1px 1px rgba(0,0,0,.4)}

/* ---- chrome icons ---- */
#top{display:flex;align-items:center;justify-content:flex-end;gap:2px;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
#top .tl{margin-right:auto;display:flex;align-items:center;gap:7px;padding-left:6px;
  font:italic 900 13px/1 var(--lbl);letter-spacing:.06em;color:var(--red);white-space:nowrap;pointer-events:none}
#top .tl svg{width:20px;height:20px}
#top .tl span{color:#fcfcfc}
body.m-landscape #top .tl,body.m-desktop #top .tl,body.tvmode #top .tl{display:none}
.ui{appearance:none;-webkit-appearance:none;width:var(--uiw,40px);height:38px;display:flex;align-items:center;justify-content:center;
  margin:0;padding:0;border:0;border-radius:8px;background:transparent;color:#8a8a8a;cursor:pointer;touch-action:manipulation;outline:none}
.ui svg{display:block;fill:currentColor;shape-rendering:crispEdges}
.ui:hover{color:#d8d8d8;background:rgba(255,255,255,.06)}
.ui:active{transform:translateY(1px)}
.ui:focus-visible{box-shadow:0 0 0 2px #fcfcfc}
.ui.on{color:#fcfcfc}
.ui.muted{color:#f83800}
.ui[hidden]{display:none}
body.m-desktop #top{gap:0}
body.m-desktop .ui{width:34px;height:30px;color:#77777d}
body.m-desktop .ui:hover{color:#e0e0e0}
body.m-desktop .ui.on{color:#fcfcfc}
body.m-desktop .ui.muted{color:#f83800}
body.tvmode #top{opacity:.18;transition:opacity .3s}
body.tvmode #top:hover{opacity:1}

/* ---- keyboard hint (desktop) ---- */
#hint{display:none;text-align:center;white-space:nowrap;color:#6b6b78;font-size:11px;line-height:22px;letter-spacing:.04em}
body.m-desktop #hint{display:block}
body.tvmode #hint{display:none}
#thint{position:absolute;display:none;text-align:center;white-space:nowrap;color:#5f5f6c;font-size:11px;line-height:16px;letter-spacing:.12em;pointer-events:none}
#thint b{color:var(--red);font-weight:900}
body.m-portrait #thint.show{display:block}
#hint kbd{display:inline-block;min-width:18px;padding:0 4px;margin:0 1px;border:1px solid #3c3c46;border-bottom-width:2px;border-radius:4px;
  font:inherit;line-height:15px;color:#c9c9d2;background:#121218;text-align:center}
#hint i{font-style:normal;color:#9b9ba8;margin-right:10px}
#hint i:last-child{margin-right:0}

/* ---- NES controller ---- */
.pad{display:none}
body.m-portrait .pad,body.m-landscape .pad{display:block}
body.m-landscape .po,body.m-portrait .lo{display:none}
#padbg{border-radius:4.2%/8.6%;
  background:linear-gradient(180deg,#dadada 0,#c6c6c6 6%,#bdbdbd 60%,#acacac 100%);
  box-shadow:0 5px 0 #6c6c6c,0 9px 22px rgba(0,0,0,.7),inset 0 2px 0 #f2f2f2,inset 0 -2px 0 #9a9a9a}
#face{border-radius:10px;background:linear-gradient(180deg,#2e2e2e 0,#262626 45%,#1e1e1e 100%);
  box-shadow:inset 0 0 0 1px #0d0d0d,inset 0 3px 4px rgba(0,0,0,.7),0 1px 0 #ececec,0 -1px 0 #8a8a8a}
.stripe{border-radius:3px;background:linear-gradient(180deg,#d4d4d4,#a2a2a2);box-shadow:0 1px 0 #0c0c0c,inset 0 1px 0 #ececec}
#logo{color:var(--red);font:italic 900 15px/1 var(--lbl);letter-spacing:.04em;text-align:right;white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.6)}
.well{border-radius:9px;background:linear-gradient(180deg,#d2d2d2,#a6a6a6);
  box-shadow:inset 0 1px 0 #f0f0f0,inset 0 -1px 0 #8c8c8c,0 1px 0 #0c0c0c}
.lbl{color:var(--red);font:900 12px/1 var(--lbl);letter-spacing:.06em;white-space:nowrap;text-align:center;pointer-events:none}
.pill{border-radius:999px;background:linear-gradient(180deg,#444 0,#1e1e1e 45%,#0b0b0b 100%);
  box-shadow:0 2px 0 #000,0 3px 3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .03s}
.pill.on{transform:translateY(2px);background:linear-gradient(180deg,#151515,#000);box-shadow:inset 0 2px 3px #000,0 0 0 #000}
.sock{border-radius:13%;background:linear-gradient(180deg,#e6e6e6 0,#c8c8c8 40%,#a9a9a9 100%);
  box-shadow:inset 0 2px 0 #f7f7f7,inset 0 -2px 0 #888,0 1px 0 #0a0a0a,0 2px 4px rgba(0,0,0,.6)}
.btn{position:absolute;left:7%;top:7%;width:86%;height:86%;border-radius:50%;
  background:radial-gradient(circle at 50% 62%,#ea3426 0,#d8261a 45%,#c01a10 72%,#93100a 100%);
  box-shadow:0 3px 0 #5a0703,0 5px 5px rgba(0,0,0,.5),inset 0 4px 5px rgba(80,0,0,.55),inset 0 -2px 1px rgba(255,150,130,.45),inset 0 0 0 1px #7a0a05;
  transition:transform .03s}
.btn.on{transform:translateY(3px);background:radial-gradient(circle at 50% 45%,#b81c11 0,#a3140a 60%,#6c0703 100%);
  box-shadow:0 0 0 #5a0703,inset 0 3px 6px rgba(40,0,0,.7)}
#dpad{--rx:0deg;--ry:0deg}
#dpad svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;display:block}
#dpad .x{transform-origin:50% 50%;transform:perspective(420px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .04s}
#dpad.u{--rx:13deg}#dpad.d{--rx:-13deg}#dpad.l{--ry:-13deg}#dpad.r{--ry:13deg}
#dpad .arm{fill:#000;opacity:0;transition:opacity .03s}
#dpad.u .au,#dpad.d .ad,#dpad.l .al,#dpad.r .ar{opacity:.55}
#dpad .plate{display:none}
body.m-landscape #dpad .plate{display:block}
</style>

  function setPad(on, persist) { S.pad = !!on; if (persist !== false) lsSet('bp_pad', S.pad ? '1' : '0'); layout() }

  function uiBtn(el, fn) {

  // ---------- layout ----------
  var PW = 400, PH = 196 // portrait controller design units
  function insets() {

  function planLandscape(ax, ay, aw, ah) {

  function layout() {

    var ax = ins.l, ay = ins.t, aw = Math.max(200, w - ins.l - ins.r), ah = Math.max(200, h - ins.t - ins.b)

    var s, sw, sh, sx, sy, top = $('top'), hint = $('hint'), tv = $('tv')

        $('led').style.bottom = '17px'; $('led').style.right = '20px'
        tv.style.setProperty('--bz', bz - 3 + 'px'); tv.style.setProperty('--chin', chin - 3 + 'px')
        tv.style.borderRadius = Math.round(bz * 1.3 + 6) + 'px'
        $('brand').style.display = tw > 420 ? '' : 'none'
        ipx = 2
        var tbw = 34 * 4 + 10
        pos(top, tx + tw - tbw - 36, ty + th - chin + 5, tbw, chin - 10)
        pos(hint, ax, ty + th + 4, aw, 22)
      } else {

        pos(top, ax + aw - 34 * 4 - 8, ay + 4, 34 * 4, 30)
      }
    } else if (plan.mode === 'portrait') {
      s = snap(plan.sMax)
      sw = R(256 * s); sh = R(240 * s)

      // controller anchored at the bottom (thumb reach); the screen, in a little TV, centred in the space above
      var regionTop = ay + plan.topH
      var padH = Math.min(plan.padH, ay + ah - plan.bot - plan.gap - regionTop - sh), padW = padH * PW / PH
      var py0 = ay + ah - plan.bot - padH

      var bz = side >= 6 ? Math.min(14, Math.floor(side - 2)) : 0, chin = bz ? 24 : 0
      if (sh + bz + chin > regionH) { bz = 0; chin = 0 }
      var th = sh + bz + chin
      var hintH = regionH - th >= 40 ? 22 : 0
      var ty = regionTop + Math.max(0, (regionH - th - hintH) * 0.4)
      sx = ax + (aw - sw) / 2; sy = ty + bz
      tv.classList.toggle('show', bz > 0)
      if (bz > 0) {
        pos(tv, sx - bz, ty, sw + 2 * bz, th)
        tv.style.setProperty('--bz', bz - 3 + 'px'); tv.style.setProperty('--chin', chin - 3 + 'px')
        tv.style.borderRadius = Math.round(bz + 6) + 'px'
        var br = $('brand'); br.style.display = ''; br.style.fontSize = '10px'; br.style.bottom = (chin - 10) / 2 + 'px'; br.style.left = bz + 4 + 'px'
        var led = $('led'); led.style.bottom = (chin - 8) / 2 + 'px'; led.style.right = bz + 4 + 'px'
      }
      var thint = $('thint')
      thint.classList.toggle('show', hintH > 0)
      if (hintH) pos(thint, ax, ty + th + (regionTop + regionH - (ty + th) - 16) / 2, aw, 16)

    } else { // landscape
      s = snap(plan.sMax)
      sw = R(256 * s); sh = R(240 * s)
      sx = ax + (aw - sw) / 2; sy = ay + (ah - sh) / 2

      tv.classList.remove('show')

      var n = nIcons(), iw = Math.max(30, Math.min(40, Math.floor((lw - 6) / n))), rowH = 38
      top.style.setProperty('--uiw', iw + 'px')
      pos(top, ax + (lw - iw * n) / 2, ay + 2, iw * n, rowH)
      top.style.justifyContent = 'center'
      ipx = iw >= 36 ? 3 : 2
      placeLandscapePad(ax, ay, lw, sx + sw, rw, ah, ay + 2 + rowH + 8)
    }
    if (plan.mode !== 'landscape') { top.style.justifyContent = ''; top.style.removeProperty('--uiw') }
    if (plan.mode !== 'portrait') $('thint').classList.remove('show')
    pos(scr, sx, sy, sw, sh)
    scr.style.setProperty('--px', s + 'px')
    S.s = s
    S.rect = { x: sx, y: sy, w: sw, h: sh }
    syncUI()
  }

  function placePortraitPad(x0, y0, u) {
    function P(el, x, y, w, h) { pos(el, x0 + x * u, y0 + y * u, w * u, h * u) }
    function PC(el, cx, cy, w, h) { P(el, cx - w / 2, cy - h / 2, w, h) }
    P($('padbg'), 0, 0, PW, PH)
    P($('face'), 8, 8, PW - 16, PH - 16); $('face').style.borderRadius = 9 * u + 'px'
    var stripes = ['st1', 'st2', 'st3', 'st4'], ys = [26, 41, 56, 160]
    for (var i = 0; i < 4; i++) P($(stripes[i]), 134, ys[i], 92, 8)
    var lg = $('logo'); P(lg, 230, 20, 156, 18); lg.style.fontSize = 14 * u + 'px'; lg.style.textAlign = 'right'
    lg.textContent = 'PARTY SOFT'; lg.style.display = ''
    P($('well1'), 134, 100, 92, 46); $('well1').style.borderRadius = 9 * u + 'px'
    PC($('pSel'), 158, 123, 36, 15); PC($('pSt'), 202, 123, 36, 15)
    var fs = 9.5 * u + 'px'
    PC($('lSel'), 158, 87, 50, 11); PC($('lSt'), 202, 87, 50, 11)
    $('lSel').style.fontSize = $('lSt').style.fontSize = fs
    PC($('dpad'), 72, 104, 112, 112)
    PC($('sB'), 268, 108, 78, 78); PC($('sA'), 352, 108, 78, 78)
    var lf = 15 * u
    P($('lB'), 288, 152, 18, 16); P($('lA'), 372, 152, 18, 16)
    $('lB').style.fontSize = $('lA').style.fontSize = lf + 'px'
    $('lB').style.textAlign = $('lA').style.textAlign = 'right'
  }

  function placeLandscapePad(lx, y0, lw, rx, rw, ah, leftTop) {
    var lcx = lx + lw / 2, rcx = rx + rw / 2
    // SELECT / START at the bottom of each side, labels above them
    var pw = Math.max(40, Math.min(lw * 0.42, rw * 0.42, 62)), ph = pw * 0.38, bottomY = y0 + ah - Math.max(12, ah * 0.045) - ph / 2 - 6
    var lfs = Math.max(9, pw * 0.2), lblY = bottomY - ph / 2 - 6 - lfs * 0.6
    PCx($('pSel'), lcx, bottomY, pw, ph); PCx($('pSt'), rcx, bottomY, pw, ph)
    PCx($('well1'), lcx, bottomY, pw + 12, ph + 12); PCx($('well2'), rcx, bottomY, pw + 12, ph + 12)
    $('well1').style.borderRadius = $('well2').style.borderRadius = (ph + 12) / 2 + 'px'
    $('lSel').style.fontSize = $('lSt').style.fontSize = lfs + 'px'
    PCx($('lSel'), lcx, lblY, pw * 1.6, lfs); PCx($('lSt'), rcx, lblY, pw * 1.6, lfs)
    var bandTop = leftTop, bandBot = lblY - lfs - 8, cy = (bandTop + bandBot) / 2 + ah * 0.02
    // D-pad: as big as the column / band allows, never under the toolbar row
    var dz = Math.max(72, Math.min(lw * 0.84, (bandBot - bandTop) / 1.07, 190))
    var dcy = Math.max(bandTop + dz * 0.57, Math.min(cy, bandBot - dz / 2)) // 0.57: the round plate overhangs 7%
    PCx($('dpad'), lcx, dcy, dz, dz)
    cy = Math.max(cy, y0 + 48)
    // A / B: level like the NES pad when there is room, otherwise a thumb-friendly diagonal
    var d = Math.max(52, Math.min(rw * 0.44, ah * 0.22, 96)), sk, gap, bx, by, axx, ayy, diag = false
    sk = d * 1.14; gap = Math.max(8, d * 0.12)
    if (rw >= 2 * sk + 3 * gap) { bx = rcx - (sk + gap) / 2; axx = rcx + (sk + gap) / 2; by = cy + d * 0.06; ayy = cy - d * 0.06 }
    else { // diagonal: B low-left, A high-right; squares never overlap vertically
      diag = true
      var band = bandBot - (y0 + 10)
      if (2 * sk + gap > band) { d = Math.max(48, (band - gap) / 2 / 1.14); sk = d * 1.14 }
      var dx = Math.max(0, (rw - sk) / 2 - 6), dy = (sk + gap) / 2
      var c2 = Math.max(y0 + 10 + dy + sk / 2, Math.min(cy, bandBot - dy - sk / 2))
      bx = rcx - dx; axx = rcx + dx; by = c2 + dy; ayy = c2 - dy
    }
    PCx($('sB'), bx, by, sk, sk); PCx($('sA'), axx, ayy, sk, sk)
    var lf = Math.max(12, d * 0.2)
    $('lB').style.fontSize = $('lA').style.fontSize = lf + 'px'
    $('lB').style.textAlign = $('lA').style.textAlign = 'center'
    if (diag) { // labels in the empty corners of the diagonal
      PCx($('lB'), bx + sk / 2 + lf * 0.8, by + sk * 0.3, lf * 1.2, lf)
      PCx($('lA'), axx - sk / 2 - lf * 0.8, ayy - sk * 0.3, lf * 1.2, lf)
    } else {
      PCx($('lB'), bx + sk * 0.36, by + sk * 0.5 + lf * 0.75, lf * 1.2, lf)
      PCx($('lA'), axx + sk * 0.36, ayy + sk * 0.5 + lf * 0.75, lf * 1.2, lf)
    }
    var lg = $('logo'); lg.textContent = '1519 MADISON TAILGATE'
    var lgf = Math.max(8, Math.min(12, rw * 0.06))
    lg.style.fontSize = lgf + 'px'; lg.style.textAlign = 'center'
    PCx(lg, rcx, y0 + 22, rw - 8, lgf + 2)
    lg.style.display = (ayy - sk / 2) - (y0 + 22 + lgf) > 6 ? '' : 'none'
  }
  function PCx(el, cx, cy, w, h) { posC(el, cx, cy, w, h) }

  // ---------- resize / orientation (debounced, plus late re-checks for iOS toolbar animation) ----------
  var raf = 0
  function relayout() {

    raf = (W.requestAnimationFrame || setTimeout)(function () { raf = 0; layout() })
  }

  W.addEventListener('orientationchange', lateRelayout)
  if (W.visualViewport) W.visualViewport.addEventListener('resize', relayout)

  D.addEventListener('webkitfullscreenchange', lateRelayout)

  } catch (e) {}

  BP.Shell = {
    state: S, layout: layout, relayout: relayout, syncUI: syncUI,
    setPad: setPad, togglePad: function () { setPad(!S.pad) }, padVisible: function () { return S.mode === 'portrait' || S.mode === 'landscape' },

})()
