<style>
:root{color-scheme:dark;--red:#e4211a;--lbl:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;left:0;top:0;right:0;bottom:0;height:100vh;height:100dvh;color:#bcbcbc;
  font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#000}
body.m-desktop #app{background:radial-gradient(ellipse 80% 70% at 50% 42%,#14142a 0,#07070f 55%,#000 100%)}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.abs,#scr,#tv,#top,#hint,#padbg,#dpad,.sock,.pill,.well,.lbl,.stripe,#cord,#face,#logo{position:absolute}
img,svg,canvas{-webkit-user-drag:none;user-select:none}

/* ---- game screen ---- */
#scr{left:0;top:0;width:256px;height:240px;background:#000;overflow:hidden;contain:strict}
#screen{display:block;width:100%;height:100%;background:#000;cursor:pointer;touch-action:none;outline:none;
  image-rendering:optimizeSpeed;image-rendering:-moz-crisp-edges;image-rendering:-webkit-optimize-contrast;
  image-rendering:crisp-edges;image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor}
#crt{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;display:none;
  background:
    radial-gradient(ellipse 75% 70% at 50% 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.42) 100%),
    repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) calc(var(--px,3px)*.55),rgba(0,0,0,.30) calc(var(--px,3px)*.55),rgba(0,0,0,.30) var(--px,3px)),
    repeating-linear-gradient(to right,rgba(255,40,40,.035) 0,rgba(40,255,40,.035) 1px,rgba(40,80,255,.035) 2px,rgba(0,0,0,0) 3px)}
body.crt #crt{display:block}
body.crt #scr{border-radius:calc(var(--px,3px)*5)/calc(var(--px,3px)*6)}
body.crt #screen{filter:brightness(1.12) saturate(1.12) contrast(1.04)}
body.crt #scr::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;
  box-shadow:inset 0 0 calc(var(--px,3px)*10) rgba(0,0,0,.65),inset 0 0 2px rgba(0,0,0,.9)}

/* ---- CRT TV bezel (desktop) ---- */
#tv{display:none;border-radius:26px;
  background:linear-gradient(180deg,#3b3b3e 0,#232326 3%,#18181b 50%,#111113 92%,#0a0a0b 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.85),0 0 0 1px #000,inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.6)}
#tv::before{content:"";position:absolute;left:var(--bz,16px);right:var(--bz,16px);top:var(--bz,16px);bottom:var(--chin,44px);
  border-radius:12px;background:#050505;box-shadow:inset 0 0 0 2px #000,0 1px 0 rgba(255,255,255,.08),0 -1px 0 rgba(0,0,0,.8)}
body.m-desktop #tv{display:block}
body.m-desktop #scr{box-shadow:0 0 0 2px #000}
#brand{position:absolute;left:22px;bottom:13px;font:italic 900 13px/1 var(--lbl);letter-spacing:.18em;color:#8d8d93;
  text-shadow:0 1px 0 #000,0 -1px 0 rgba(255,255,255,.12)}
#brand b{color:var(--red);font-style:italic}
#led{position:absolute;right:20px;bottom:17px;width:8px;height:8px;border-radius:50%;background:#ff2a1a;
  box-shadow:0 0 6px 1px rgba(255,40,20,.8),inset 0 -1px 1px rgba(0,0,0,.4)}

/* ---- chrome icons ---- */
#top{display:flex;align-items:center;justify-content:flex-end;gap:2px;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
#top .tl{margin-right:auto;display:flex;align-items:center;gap:7px;padding-left:6px;
  font:italic 900 13px/1 var(--lbl);letter-spacing:.06em;color:var(--red);white-space:nowrap;pointer-events:none}
#top .tl svg{width:20px;height:20px}
#top .tl span{color:#fcfcfc}
body.m-landscape #top .tl,body.m-desktop #top .tl,body.tvmode #top .tl{display:none}
.ui{appearance:none;-webkit-appearance:none;width:40px;height:38px;display:flex;align-items:center;justify-content:center;
  margin:0;padding:0;border:0;border-radius:8px;background:transparent;color:#8a8a8a;cursor:pointer;touch-action:manipulation;outline:none}
.ui svg{display:block;fill:currentColor;shape-rendering:crispEdges}
.ui:hover{color:#d8d8d8;background:rgba(255,255,255,.06)}
.ui:active{transform:translateY(1px)}
.ui:focus-visible{box-shadow:0 0 0 2px #fcfcfc}
.ui.on{color:#fcfcfc}
.ui.muted{color:#f83800}
.ui[hidden]{display:none}
body.m-desktop #top{gap:0}
body.m-desktop .ui{width:34px;height:30px;color:#77777d}
body.m-desktop .ui:hover{color:#e0e0e0}
body.m-desktop .ui.on{color:#fcfcfc}
body.m-desktop .ui.muted{color:#f83800}
body.tvmode #top{opacity:.18;transition:opacity .3s}
body.tvmode #top:hover{opacity:1}

/* ---- keyboard hint (desktop) ---- */
#hint{display:none;text-align:center;white-space:nowrap;color:#6b6b78;font-size:11px;line-height:22px;letter-spacing:.04em}
body.m-desktop #hint{display:block}
body.tvmode #hint{display:none}
#hint kbd{display:inline-block;min-width:18px;padding:0 4px;margin:0 1px;border:1px solid #3c3c46;border-bottom-width:2px;border-radius:4px;
  font:inherit;line-height:15px;color:#c9c9d2;background:#121218;text-align:center}
#hint i{font-style:normal;color:#9b9ba8;margin-right:10px}
#hint i:last-child{margin-right:0}

/* ---- NES controller ---- */
.pad{display:none}
body.m-portrait .pad,body.m-landscape .pad{display:block}
body.m-landscape .po,body.m-portrait .lo{display:none}
#padbg{border-radius:4.2%/8.6%;
  background:linear-gradient(180deg,#dadada 0,#c6c6c6 6%,#bdbdbd 60%,#acacac 100%);
  box-shadow:0 5px 0 #6c6c6c,0 9px 22px rgba(0,0,0,.7),inset 0 2px 0 #f2f2f2,inset 0 -2px 0 #9a9a9a}
#face{border-radius:10px;background:linear-gradient(180deg,#2e2e2e 0,#262626 45%,#1e1e1e 100%);
  box-shadow:inset 0 0 0 1px #0d0d0d,inset 0 3px 4px rgba(0,0,0,.7),0 1px 0 #ececec,0 -1px 0 #8a8a8a}
.stripe{border-radius:3px;background:linear-gradient(180deg,#d4d4d4,#a2a2a2);box-shadow:0 1px 0 #0c0c0c,inset 0 1px 0 #ececec}
#logo{color:var(--red);font:italic 900 15px/1 var(--lbl);letter-spacing:.04em;text-align:right;white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.6)}
.well{border-radius:9px;background:linear-gradient(180deg,#d2d2d2,#a6a6a6);
  box-shadow:inset 0 1px 0 #f0f0f0,inset 0 -1px 0 #8c8c8c,0 1px 0 #0c0c0c}
.lbl{color:var(--red);font:900 12px/1 var(--lbl);letter-spacing:.06em;white-space:nowrap;text-align:center;pointer-events:none}
.pill{border-radius:999px;background:linear-gradient(180deg,#444 0,#1e1e1e 45%,#0b0b0b 100%);
  box-shadow:0 2px 0 #000,0 3px 3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .03s}
.pill.on{transform:translateY(2px);background:linear-gradient(180deg,#151515,#000);box-shadow:inset 0 2px 3px #000,0 0 0 #000}
.sock{border-radius:13%;background:linear-gradient(180deg,#e6e6e6 0,#c8c8c8 40%,#a9a9a9 100%);
  box-shadow:inset 0 2px 0 #f7f7f7,inset 0 -2px 0 #888,0 1px 0 #0a0a0a,0 2px 4px rgba(0,0,0,.6)}
.btn{position:absolute;left:7%;top:7%;width:86%;height:86%;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#e8382a 0,#d62416 52%,#b3140b 78%,#7d0904 100%);
  box-shadow:0 4px 0 #5a0703,0 6px 5px rgba(0,0,0,.55),inset 0 2px 1px rgba(255,170,150,.55),inset 0 -4px 6px rgba(70,0,0,.45);
  transition:transform .03s}
.btn::after{content:"";position:absolute;left:24%;top:16%;width:30%;height:18%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,220,210,.55),rgba(255,220,210,0) 70%)}
.btn.on{transform:translateY(4px);background:radial-gradient(circle at 50% 45%,#b81c11 0,#a3140a 60%,#6c0703 100%);
  box-shadow:0 0 0 #5a0703,inset 0 3px 6px rgba(40,0,0,.7)}
#dpad{--rx:0deg;--ry:0deg}
#dpad svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;display:block}
#dpad .x{transform-origin:50% 50%;transform:perspective(420px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .04s}
#dpad.u{--rx:13deg}#dpad.d{--rx:-13deg}#dpad.l{--ry:-13deg}#dpad.r{--ry:13deg}
#dpad .arm{fill:#000;opacity:0;transition:opacity .03s}
#dpad.u .au,#dpad.d .ad,#dpad.l .al,#dpad.r .ar{opacity:.55}
#dpad .plate{display:none}
body.m-landscape #dpad .plate{display:block}
#cord{display:none;pointer-events:none;overflow:visible}
body.m-portrait #cord.show{display:block}
</style>

  }

  // -------------------------------------------------------------- http ----
  // Only probe the API where it can exist: the Next app (and devserver) set cookie bp_api=1 on the
  // game page; ?api forces it. On static hosts / file:// / artifacts we never fetch, so no 404s
  // ("Failed to load resource") ever reach the console.
  function canHttp() {
    try {
      return /^https?:$/.test(window.location.protocol) && typeof fetch === 'function' &&
        (/(^|;\s*)bp_api=1/.test(document.cookie) || /[?&]api(\b|=|&|$)/.test(window.location.search))
    } catch (e) { return false }
  }
  // Resolves {status, json}; status 0 = network error / timeout. Never rejects.
  function req(method, query, body) {
    var ctl = null; try { ctl = new AbortController() } catch (e) { }
    var opts = { method: method, cache: 'no-store', credentials: 'same-origin', headers: { accept: 'application/json', 'x-bp-soft': '1' } }
    if (ctl) opts.signal = ctl.signal
    if (body) { opts.headers['content-type'] = 'application/json'; opts.body = JSON.stringify(body) }
    var p = fetch(API + (query || ''), opts).then(function (r) {
      return r.json().then(function (j) {
        // soft errors arrive as 200 {ok:false, status} (see route.ts soften())
        return { status: r.status === 200 && j && j.ok === false && j.status ? j.status : r.status, json: j }
      }, function () { return { status: r.status, json: null } })
    })
    return timeout(p, TIMEOUT, { status: 0, json: null }).then(function (r) {
      if (r.status === 0 && ctl) { try { ctl.abort() } catch (e) { } }
      return r
    })
  }

  // ---------------------------------------------------------------- db ----
  function dbTop(n) {
    return timeout(dbns.collection('scores').orderBy('score', 'desc').limit(n).get().then(function (snap) {
      return sortList(clean(snap.docs.map(function (d) { return d.data() })))
    }), TIMEOUT, null)
  }

  // ------------------------------------------------------- global ops ----
  // -> list or null (failed)
  function fetchTop(n) {
    if (backend === 'db') return dbTop(n)
    if (backend === 'http') return req('GET', '?limit=' + n).then(function (r) {
      return r.status === 200 && r.json && Array.isArray(r.json.top) ? sortList(clean(r.json.top)) : null
    })
    return Promise.resolve(null)
  }
  // -> {status:'ok', rank, top} | {status:'retry'} | {status:'rejected', reason}
  function push(p) {
    var why = plausible(p)
    if (why) return Promise.resolve({ status: 'rejected', reason: why })
    if (backend === 'http') return req('POST', '', p).then(function (r) {
      var j = r.json || {}
      if (r.status === 200 && j.ok) return { status: 'ok', rank: j.rank, top: clean(j.top) }
      if (r.status === 503 && j.error === 'leaderboard_unconfigured') return { status: 'rejected', reason: j.error }
      if (r.status === 0 || r.status === 429 || r.status >= 500) return { status: 'retry', reason: j.error || ('http_' + r.status) }
      return { status: 'rejected', reason: j.error || ('http_' + r.status) }
    })
    if (backend === 'db') {
      var doc = { id: p.id, name: p.name, score: p.score, stage: p.stage, round: p.round, ts: p.ts }
      ;['cups', 'accuracy', 'shots', 'makes', 'durationMs'].forEach(function (k) { if (p[k] != null) doc[k] = p[k] })
      var write = function () { return dbns.collection('scores').doc(p.id).set(doc) } // fixed id => retry-safe
      var fail = {}
      return timeout(write().catch(function (e) {
        var code = e && e.code
        if (code === 'unavailable') return sleep(300 + Math.random() * 700).then(write)
        throw e
      }).then(function () { return 'ok' }, function (e) { return { code: (e && e.code) || 'unavailable' } }), TIMEOUT, fail).then(function (w) {
        if (w === fail) return { status: 'retry', reason: 'timeout' }
        if (w !== 'ok') {
          var c = w.code
          if (c === 'unavailable' || c === 'resource_exhausted') return { status: 'retry', reason: c }
          return { status: 'rejected', reason: c } // view-only viewer, quota, revoked...
        }
        return Promise.all([
          dbTop(10),
          timeout(dbns.collection('scores').where('score', '>', p.score).limit(1000).get().then(function (s) { return s.size }), TIMEOUT, null),
        ]).then(function (r) {
          var top = r[0] || mergedGlobal(cache, p)
          return { status: 'ok', rank: r[1] != null ? r[1] + 1 : rankIn(top, p), top: top }
        })
      })
    }
    return Promise.resolve({ status: 'rejected', reason: 'no_backend' })
  }

  // Deliver queued scores, oldest first. Single-flight; stops at the first transient failure.
  function flush() {
    if (!backend || flushP) return flushP || Promise.resolve()
    var q = pending(); if (!q.length) return Promise.resolve()
    lastFlush = Date.now()
    flushP = (function next() {
      var item = pending()[0]
      if (!item) return Promise.resolve()
      return push(item).then(function (r) {
        if (r.status === 'retry') { lastError = r.reason; return }
        setPending(pending().filter(function (x) { return x && x.id !== item.id }))
        if (r.status === 'ok') { cache = r.top; seeBest(r.top) } else lastError = r.reason
        return next()
      })
    })().then(function () { flushP = null }, function () { flushP = null })
    return flushP
  }

  // --------------------------------------------------------- detection ----
  function detect() {
    var hasClaude = false
    try { hasClaude = !!(window.claude && typeof window.claude.use === 'function') } catch (e) { }
    var step = Promise.resolve(null)
    if (hasClaude) {
      step = timeout(Promise.resolve().then(function () { return window.claude.use('db') }), DB_WAIT, null).then(function (ns) {
        if (!ns) return null
        dbns = ns; backend = 'db'
        return dbTop(10).then(function (list) {
          if (list) return list
          backend = null; dbns = null; return null
        })
      })
    }
    return step.then(function (list) {
      if (list) return list
      if (!canHttp()) return null
      backend = 'http'
      return fetchTop(10).then(function (l) { if (!l) backend = null; return l })
    }).then(function (list) {
      if (list) { cache = list; seeBest(list) }
    })
  }

  function init() {
    if (!initP) {
      initP = detect().catch(function () { backend = null }).then(function () {
        try { window.addEventListener('online', function () { flush() }) } catch (e) { }
        flush() // background; init does not wait for the queue
      })
    }
    return initP
  }

  // ------------------------------------------------------------ public ----
  function top(n) {
    n = int(n, 1, 100, 10)
    return init().then(function () {
      if (!backend) return localList().slice(0, n)
      if (pending().length && Date.now() - lastFlush > 15000) flush()
      return fetchTop(n).then(function (list) {
        if (list) { degraded = false; if (!cache || n >= cache.length) cache = list; seeBest(list); return mergedGlobal(list).slice(0, n) }
        if (cache) return mergedGlobal(cache).slice(0, n)
        degraded = true
        return localList().slice(0, n)
      })
    }).catch(function () { return localList().slice(0, n) })
  }

  function best() {
    return init().then(function () {
      var l = localList(), lb = l.length ? l[0].score : 0
      if (!backend) return lb
      return fetchTop(1).then(function (list) {
        if (list) seeBest(list)
        var pb = 0; clean(pending()).forEach(function (e) { if (e.score > pb) pb = e.score })
        return Math.max(lb, globalBest, pb)
      })
    }).catch(function () { var l = localList(); return l.length ? l[0].score : 0 })
  }

  function submit(entry) {
    var p
    try { p = buildPayload(entry) } catch (e) { p = buildPayload({}) }
    var local = saveLocal(p)
    var localResult = function (extra) {
      var res = { rank: rankIn(local, p), top: withYou(local.slice(0, 10), p.id), mode: 'local', id: p.id }
      for (var k in extra) res[k] = extra[k]
      return res
    }
    return init().then(function () {
      if (!backend) return localResult({})
      return push(p).then(function (r) {
        if (r.status !== 'retry') flush() // deliver older queued scores in the background
        if (r.status === 'ok') {
          degraded = false; cache = r.top; seeBest(r.top)
          return { rank: r.rank, top: withYou(mergedGlobal(r.top).slice(0, 10), p.id), mode: 'global', id: p.id }
        }
        lastError = r.reason
        if (r.status === 'retry') {
          enqueue(p)
          var m = mergedGlobal(cache)
          return { rank: rankIn(m, p), top: withYou(m.slice(0, 10), p.id), mode: 'global', id: p.id, queued: true }
        }
        return localResult({ rejected: r.reason })
      })
    }).catch(function () { return localResult({}) })
  }

  return {
    init: init,
    mode: function () { return backend && !degraded ? 'global' : 'local' },
    top: top,
    best: best,
    submit: submit,
    // extras (not in SPEC; handy for UI / QA)
    sanitizeName: sanitizeName,
    plausible: plausible,
    status: function () { return { mode: backend && !degraded ? 'global' : 'local', backend: backend, pending: pending().length, lastError: lastError } },
    _checksum: checksum,
  }
})()

</script>
